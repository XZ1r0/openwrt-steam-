name: Build OpenWrt
on:
  workflow_dispatch:
    inputs:
      version:
        description: OpenWrt release
        required: true
        default: 23.05.5
      extra_packages:
        description: Extra ImageBuilder packages
        required: false
        default: ""
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            target: x86/64
            archive_target: x86-64
            remove_packages: ""
          - name: arm64
            target: armsr/armv8
            archive_target: armsr-armv8
            remove_packages: "-kmod-amazon-ena -kmod-bcmgenet -kmod-dwmac-imx -kmod-dwmac-rockchip -kmod-dwmac-sun8i -kmod-fsl-dpaa1-net -kmod-fsl-dpaa2-net -kmod-fsl-enetc-net -kmod-fsl-fec -kmod-mvneta -kmod-mvpp2 -kmod-octeontx2-net -kmod-renesas-net-avb -kmod-thunderx-net"
          - name: armv7
            target: armsr/armv7
            archive_target: armsr-armv7
            remove_packages: "-kmod-amazon-ena -kmod-bcmgenet -kmod-dwmac-imx -kmod-dwmac-rockchip -kmod-dwmac-sun8i -kmod-fsl-dpaa1-net -kmod-fsl-dpaa2-net -kmod-fsl-enetc-net -kmod-fsl-fec -kmod-mvneta -kmod-mvpp2 -kmod-octeontx2-net -kmod-renesas-net-avb -kmod-thunderx-net"
    env:
      OPENWRT_VERSION: ${{ inputs.version || '23.05.5' }}
      EXTRA_PACKAGES: ${{ inputs.extra_packages || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y curl zstd tar make

      - name: Build firmware
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE_TARGET: ${{ matrix.archive_target }}
          REMOVE_PACKAGES: ${{ matrix.remove_packages }}
        run: bash scripts/build-imagebuilder.sh

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ env.OPENWRT_VERSION }}-${{ matrix.name }}
          path: artifacts/${{ matrix.target == 'x86/64' && 'x86_64' || matrix.target == 'armsr/armv8' && 'armsr_armv8' || 'armsr_armv7' }}/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download all firmware
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: openwrt-*
          merge-multiple: true

      - name: Pack release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          find release-assets -type f -not -name SHA256SUMS -exec cp {} release-files/ \;
          (cd release-assets && find . -type f -name SHA256SUMS -print0 | xargs -0 -r cat) > release-files/SHA256SUMS
          test -n "$(find release-files -type f -not -name SHA256SUMS -print -quit)"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-files/*
          fail_on_unmatched_files: true
